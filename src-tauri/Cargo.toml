[package]
name = "kasane-desktop"
version = "0.1.0"
description = "KASANE - translucent anime schedule and subtitle companion"
authors = ["KASANE Contributors"]
license = "MPL-2.0"
repository = "https://github.com/kasane-project/kasane-desktop"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
